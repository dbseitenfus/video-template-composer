<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takeslot · galeria de templates</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #15152b; color: #f3f2f8; }
      body { margin: 0; }
      main { padding: 1rem; display: grid; gap: 1.5rem; }
      h1 { margin: 0; }
      section { display: grid; gap: 0.5rem; }
      h2 { margin: 0; font-size: 1.05rem; }
      h2 small { color: #a8a7c2; font-weight: 400; }
      .strip { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.4rem; }
      figure { margin: 0; display: grid; gap: 0.25rem; flex: none; }
      canvas { height: 240px; border-radius: 8px; background: #000; }
      figcaption { font-size: 0.75rem; color: #a8a7c2; max-width: 200px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Galeria de templates</h1>
      <p>Cada quadro é desenhado pela mesma <code>renderFrame</code> do app, um segundo após o início de cada parte. Os trechos gravados aparecem como marcadores.</p>
      <div id="gallery"></div>
    </main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
