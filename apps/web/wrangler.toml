# Cloudflare Pages: app estático (dist) + Functions (/api) + D1 (templates) + R2 (arquivos).
# Veja a seção "Admin de templates" do README para criar os recursos.
name = "gravai"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "gravai"
# Criado com `npx wrangler d1 create gravai`.
database_id = "dd6ab184-452c-4228-b160-df0a8cc944f3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "gravai-assets"
